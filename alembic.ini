; Alembic configuration for dtk.
;
; The database URL is deliberately empty here: env.py reads DTK_DATABASE_URL
; (falling back to DATABASE_URL) from the environment, so no connection string
; with a password ever lives in a file that gets committed.
;
;   uv run alembic upgrade head
;   uv run alembic revision -m "add x"
;
; The migrate container runs `dtk migrate`, which drives the same scripts
; through dtk.db.migrate without needing this file.

[alembic]
script_location = %(here)s/src/dtk/db/migrations
prepend_sys_path = %(here)s/src
path_separator = os

; Revision filenames sort in application order: 0001_initial_schema.py.
file_template = %%(rev)s_%%(slug)s

sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
