# 空白 issue 关掉了，不是为了设门槛，是因为没有版本号和诊断输出的报告，
# 第一轮回复只能是"请补充信息"，对双方都是浪费。
#
# Blank issues are off. Not to raise a barrier — a report with no version and no
# diagnose output can only be answered with "please add more information", which
# wastes a round trip for both sides.
