name: CI

on:
  push:
    branches: [main]
  pull_request:
    # v4 too: the old code lives on that branch now and still takes pull
    # requests, so a change proposed against it should still be checked.
    branches: [main, v4]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only value. Real deployments generate this with `openssl rand -base64 48`
  # and the process refuses to start without it.
  DTK_SECRET_KEY: ci-secret-key-not-used-for-anything-real-0123456789
  UV_FROZEN: "1"

jobs:
  static:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Lint
        run: uv run ruff check src tests
      - name: Types
        run: uv run mypy

  unit:
    name: Unit and replay tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Unit and replay
        run: uv run pytest tests/unit tests/replay -q --cov=src/dtk --cov-report=term-missing

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_DB: dtk_test
          POSTGRES_USER: dtk
          POSTGRES_PASSWORD: dtk_test_password
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U dtk -d dtk_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    needs: console
    env:
      DTK_DATABASE_URL: postgresql+asyncpg://dtk:dtk_test_password@127.0.0.1:55432/dtk_test
      DTK_REDIS_URL: redis://127.0.0.1:56379/0
      # Never dialled. The download endpoints refuse with 501 NOT_CONFIGURED
      # when this is empty, and the work they queue is done by the worker,
      # which these tests do not run - so a port with nothing behind it is
      # enough to exercise the routes. Without it the suite passes only on a
      # machine that happens to have a .env, which is how thirty of these
      # tests stayed green locally and red here.
      DTK_DOWNLOADER_URL: http://127.0.0.1:59999
      DTK_CONSOLE_DIR: ${{ github.workspace }}/web/dist
    steps:
      - uses: actions/checkout@v7
      # The console is part of what the API serves, so the integration suite
      # asks for it: language negotiation rewrites index.html, and /docs is a
      # console route rather than a Swagger one. Taken from the console job
      # rather than built again, so there is one build and one place to change.
      - name: Console build from the console job
        uses: actions/download-artifact@v8
        with:
          name: console-dist
          path: web/dist
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Integration
        run: uv run pytest tests/integration -q -m integration

  console:
    name: Console build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      # The integration job serves this rather than building its own copy.
      - name: Publish the build for the integration job
        uses: actions/upload-artifact@v7
        with:
          name: console-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  image:
    name: Image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        run: |
          docker compose -f docker/compose.yml config -q
          docker compose -f docker/compose.test.yml config -q
      - name: Build (no push)
        run: docker build -f docker/Dockerfile -t dtk:ci .

  # Contract tests deliberately do NOT gate merges. They hit the live platform,
  # so they fail on platform hiccups, proxy trouble and an empty identity pool.
  # Blocking pull requests on them only teaches people to ignore a red check;
  # running them on a schedule keeps the signal while leaving the gate honest.
  # See docs/design/13-testing.md.
  contract:
    name: Contract tests (scheduled, non-gating)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras
      - run: uv run pytest tests/contract -q -m live || true
