# Build the images and push them to Docker Hub.
#
# Two images, and deliberately not three:
#
#   dtk (the app)   api, worker and migrate are one image that differs only in
#                   the verb handed to the entrypoint. This is the image almost
#                   everyone means by "the image".
#   dtk-downloader  the Go media sidecar. 9 MB, optional at runtime, and worth
#                   publishing so that `--profile downloader` does not make
#                   every operator build Go.
#
#   browser-rpc is NOT published. It installs CloakBrowser from a pinned commit
#   passed in as a build argument, so an image built here would ship somebody
#   else's browser under this project's name, and the pin - which is a security
#   control, see docker/Dockerfile.browser - would become ours rather than the
#   operator's. It stays a local build; docker/README.md says how.
#
# Both images are built for linux/amd64 and linux/arm64. The slow parts do not
# run under emulation: the console stage and the Go build are pinned to
# BUILDPLATFORM and produce architecture-independent or cross-compiled output
# (see the two Dockerfiles).
name: Publish Docker images

on:
  push:
    branches: [v5, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      push:
        description: "Push to Docker Hub (off = build only, to test the workflow)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Change these two together with the Docker Hub repositories they name.
  APP_IMAGE: evil0ctal/douyin_tiktok_download_api
  DOWNLOADER_IMAGE: evil0ctal/douyin_tiktok_download_api-downloader

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # One failing image must not cancel the other: a downloader build that
      # breaks is not a reason to withhold the application image.
      fail-fast: false
      matrix:
        include:
          - name: app
            image: evil0ctal/douyin_tiktok_download_api
            dockerfile: docker/Dockerfile
            # No VERSION arg: this image carries its version in the installed
            # package, which the smoke test below prints.
            build_args: ""
            description: >-
              Self-hosted Douyin and TikTok data API. REST, MCP and a web
              console, with a self-maintaining identity pool.
          - name: downloader
            image: evil0ctal/douyin_tiktok_download_api-downloader
            dockerfile: docker/Dockerfile.downloader
            build_args: VERSION=${{ github.ref_name }}
            description: >-
              Media downloader sidecar for Douyin_TikTok_Download_API. A static
              Go binary on scratch.

    steps:
      - uses: actions/checkout@v4
        with:
          # The version stamped into the image comes from `git describe`, which
          # needs the tags and enough history to find the nearest one.
          fetch-depth: 0

      # Whether to push is not a property of the event alone. A fork has no
      # credentials, and a manual run defaults to build-only so the workflow can
      # be exercised without publishing anything.
      - name: Decide whether to push
        id: mode
        env:
          HAS_CREDENTIALS: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          MANUAL_PUSH: ${{ inputs.push }}
        run: |
          if [ "${HAS_CREDENTIALS}" != "true" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "No DOCKERHUB_TOKEN; building without pushing." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "push=${MANUAL_PUSH}" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Version
        id: version
        run: echo "app_version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.mode.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` follows the default branch, and a semver tag also claims it.
      # That is what the v4 workflow did and what people who already pull this
      # image expect, so moving to "releases only" would quietly freeze `latest`
      # on v4 until somebody remembered to cut a tag.
      #
      # Every push also gets an immutable `sha-<commit>` tag, which is the one
      # to pin in production. A branch push additionally gets a moving tag named
      # after the branch.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          # Explicit, rather than leaning on `latest=auto`: the rule below says
          # exactly when `latest` moves, and two mechanisms deciding that is one
          # too many.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.version.outputs.app_version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.mode.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          # Scoped per image, or the two would evict each other's layers.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      # The image is only useful if it starts and carries what it is supposed
      # to. Three checks that need neither Postgres nor Redis:
      #
      #   - the venv and the installed package import and report a version
      #   - the console build actually reached the runtime stage, which is a
      #     separate build stage that can silently produce nothing
      #   - the entrypoint refuses an unknown role rather than starting something
      #
      # `dtk --version` is run through a shell on purpose: the entrypoint takes
      # a ROLE (api, worker, migrate), not a flag, so passing `--version` to it
      # would test the usage message and nothing else.
      - name: Smoke test the built image
        if: matrix.name == 'app'
        run: |
          docker buildx build --load --platform linux/amd64 \
            -f ${{ matrix.dockerfile }} -t dtk:smoke \
            --cache-from type=gha,scope=${{ matrix.name }} .
          docker run --rm --entrypoint sh dtk:smoke -c '
            set -e
            dtk --version
            test -s "${DTK_CONSOLE_DIR}/index.html"
            echo "console assets present"
          '
          if docker run --rm dtk:smoke not-a-role 2>/dev/null; then
            echo "entrypoint accepted an unknown role" >&2
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo
            echo "Pushed: \`${{ steps.mode.outputs.push }}\`"
            echo "Version: \`${{ steps.version.outputs.app_version }}\`"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Keeps the Docker Hub page from being an empty box. Runs once, after both
  # images, wherever `latest` moves - the page describes what `latest` is, so
  # the two have to move together.
  describe:
    name: Update Docker Hub description
    needs: publish
    if: >-
      github.repository_owner == 'Evil0ctal'
      && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push README to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: evil0ctal/douyin_tiktok_download_api
          short-description: "Self-hosted Douyin and TikTok data API: REST, MCP, web console, self-maintaining identity pool."
          readme-filepath: ./README.en.md
