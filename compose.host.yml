# Keep this file as an override so docker/compose.yml can retain its general
# deployment defaults.
services:
  postgres:
    mem_limit: 1g
    memswap_limit: 2g

  redis:
    # Redis still uses DTK_REDIS_MAXMEMORY=320mb. The extra container headroom
    # covers Redis itself, client buffers, persistence, and allocator overhead.
    mem_limit: 512m
    memswap_limit: 512m

  api:
    mem_limit: 448m
    memswap_limit: 768m
    cpus: 1.0

  worker:
    mem_limit: 448m
    memswap_limit: 768m
    cpus: 1.0

  browser-rpc:
    # Signing and occasional identity rebuilds yield CPU to transcription
    mem_limit: 2g
    memswap_limit: 3g
    cpus: 1.0

  downloader:
    mem_limit: 256m
    memswap_limit: 384m
    cpus: 0.5

  transcriber:
    # One worker with two ONNX Runtime threads; do not increase the worker
    # count on this two-physical-core host.
    mem_limit: 2g
    memswap_limit: 3g
    cpus: 2.0
