<!--
  The project mark: braces from the 2022 logo, holding something on its way down.

  Standalone, so it carries its own colours rather than currentColor: this file
  is the README header and the favicon, and neither has the console's token
  palette to inherit from. The two values are the accent and the base background
  from web/src/styles/tokens.css; keep them in step if those change.

  (No double hyphens in this comment. XML forbids them inside one, and an SVG
  that browsers happen to tolerate still fails a strict parser.)
-->
